<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APQP Takip — Sanifoam ERP</title>

<style>
:root{--bg:#f4f6fa;--kart:#fff;--kenar:#dde3ec;--metin:#1f2937;--soluk:#6b7280;--vurgu:#1e3c72}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--metin)}
.ust{background:var(--vurgu);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ust h1{font-size:17px;margin:0;font-weight:700}
.ust .bilgi{font-size:12px;opacity:.85}
button{font:inherit;border:1px solid var(--kenar);background:#fff;color:var(--metin);padding:6px 12px;border-radius:6px;cursor:pointer}
button.bas{background:#f59e0b;border-color:#f59e0b;color:#fff;font-weight:600}
button.bas:disabled{opacity:.6;cursor:default}
button.sec{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--kenar);border-radius:6px;background:#fff;color:var(--metin)}
.govde{padding:16px;max-width:1700px;margin:0 auto}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:10px;padding:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--kenar);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef2f8;font-weight:600;font-size:12px;position:sticky;top:0;z-index:2}
tr.bolum td{background:#dbe4f3;font-weight:700;font-size:13px}
td.no{white-space:nowrap;font-variant-numeric:tabular-nums;width:52px}
td.durum{width:110px;text-align:center}
.rozet{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.r0{background:#fee2e2;color:#991b1b}.r50{background:#fef3c7;color:#92400e}.r100{background:#dcfce7;color:#166534}
.kanit{font-size:11px;color:#166534;background:#dcfce7;border-radius:4px;padding:1px 5px;margin-left:4px}
.form-ad{font-size:12px;color:var(--soluk)}
a.dosya{color:#1d4ed8;text-decoration:none}a.dosya:hover{text-decoration:underline}
.gantt{overflow-x:auto}
.gantt table{font-size:11px}
.gantt td.hf{padding:0;height:20px;min-width:16px}
.cubuk{height:14px;border-radius:3px;background:#3b82f6}
.cubuk.tamam{background:#22c55e}
.durumcubugu{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:4px}
.durumcubugu i{display:block;height:100%;background:#22c55e}
.sekme{display:flex;gap:6px;margin-bottom:12px}
.uyari{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
</style></head>
<body>
<div class="ust">
  <h1>APQP Takip</h1>
  <span class="bilgi">FR91 APQP-Takip Formu &middot; 63 adım / 6 bölüm</span>
  <span style="flex:1"></span>
  <input id="kod" placeholder="Ürün kodu — birden fazlası için virgülle ayırın" style="min-width:340px">
  <button class="bas" id="uretBtn">APQP Oluştur</button>
  <select id="projeSec" style="min-width:220px"></select>
  <button id="silBtn" title="Seçili APQP kaydını sil">Sil</button>
</div>

<div class="govde">
  <div id="mesaj"></div>

  <div class="kart" id="baslikKart" hidden>
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      <div><b>Parça Numarası:</b> <span id="bParca">—</span></div>
      <div><b>Müşteri:</b> <span id="bMusteri">—</span></div>
      <div><b>APQP Tarihi:</b> <span id="bTarih">—</span></div>
      <div><b>Devreye Alma:</b> <span id="bDevreye">—</span></div>
      <div><b>Kanıt:</b> <span id="bKanit">—</span></div>
      <div><b>Tamamlanma:</b> <span id="bYuzde">—</span></div>
    </div>
    <div class="durumcubugu"><i id="bCubuk" style="width:0%"></i></div>
    <div style="margin-top:10px;font-size:12px;color:var(--soluk)" id="bEkip"></div>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button id="driveBtn">📁 Drive klasörünü aç</button>
      <button id="tazeleBtn">Kanıtları tazele</button>
      <span style="font-size:12px;color:var(--soluk)" id="bDrive"></span>
    </div>
  </div>

  <div class="sekme" id="sekmeler" hidden>
    <button class="sec" data-gorunum="liste">Liste</button>
    <button data-gorunum="gantt">Gantt</button>
  </div>

  <div class="kart" id="listeKart" hidden></div>
  <div class="kart gantt" id="ganttKart" hidden></div>
</div>

// NOT: ajanin /open ucu YALNIZ LeanSys pencerelerini acar; dosya icin
// /dosyaac ucu kullanilir (izinli koklerle sinirli).
const DRIVE_KOK = "G:\\Drive'\u0131m\\APQP";
const driveKlasoru = kod => DRIVE_KOK + '\\' + kod;

async function ajanJson(yol) {
  const r = await fetch(AJAN + yol);
  if (!r.ok) throw new Error('ajan HTTP ' + r.status);
  return r.json();
}

async function dosyaAc(yol) {
  try {
    const j = await ajanJson('/dosyaac?path=' + encodeURIComponent(yol));
    if (!j.ok) throw new Error(j.hata || 'acilamadi');
    mesaj('');
  } catch (e) {
    mesaj('Dosya açılamadı (' + e.message + '). LeanSys ajanı çalışıyor mu?<br>Yol: <code>' + yol + '</code>');
  }
}

// Urunun Drive klasorundeki dokumanlar. Ajan yoksa bos doner (uretim durmaz).
async function driveDosyalari(kod) {
  try {
    const j = await ajanJson('/dosyalar?dir=' + encodeURIComponent(driveKlasoru(kod)));
    return j.ok ? (j.dosyalar || []) : [];
  } catch { return []; }
}

// FR91 "Form" metnindeki ve dosya adindaki form kodlari (FR182, PL74, FR34...)
const formKodlari = x => [...new Set((met(x).toLocaleUpperCase('tr').match(/\b(FR|PL)\s?\d+/g) || [])
  .map(k => k.replace(/\s+/g, '')))];

// Kod tasimayan dosyalar icin anahtar kelime esleri: [dosya adi, form metni]
const DOSYA_ANAHTAR = [
  [/flow ?diagram|ak\u0131\u015f|akis/i,          /ak\u0131\u015f diyagram|akis diyagram/i],
  [/run.?at.?rate|run ?@ ?rate/i,                    /run ?@ ?rate|run.?at.?rate/i],
  [/\u00f6l\u00e7\u00fcm aletleri|olcum aletleri/i, /g\u00f6sterge|fikst\u00fcr|test ekipman|\u00f6l\u00e7\u00fcm alet/i],
  [/capability|kapasite/i,                           /kapasite/i],
];

// Bir adima ait Drive dokumanlari
function adimDriveDosyalari(form, dosyalar) {
  const kodlar = formKodlari(form);
  return dosyalar.filter(d => {
    if (kodlar.length && formKodlari(d.ad).some(k => kodlar.includes(k))) return true;
    return DOSYA_ANAHTAR.some(([dk, fk]) => dk.test(d.ad) && fk.test(met(form)));
  });
}

function mesaj(html, tur) {
  $('#mesaj').innerHTML = html ? '<div class="uyari">' + html + '</div>' : '';
}

// Girilen deger ic stok kodu OLABILIR, musteri parca numarasi da olabilir
// (LeanSys'te musteri numarasi stok_adi alaninda durur). Belirsizse tahmin
// yurutulmez; adaylar cagirana bildirilir.
async function kodCoz(giris) {
  const alan = 'stok_kodu,stok_adi,cari_adi,tr_revtarih';
  let r = await sb.from('leansys_kontrol_plani').select(alan).eq('stok_kodu', giris).limit(300);
  if ((r.data || []).length) return { kod: giris, satir: r.data };

  r = await sb.from('leansys_kontrol_plani').select(alan).ilike('stok_adi', '%' + giris + '%').limit(300);
  const satir = r.data || [];
  if (!satir.length) return { kod: giris, satir: [] };

  const kodlar = [...new Set(satir.map(x => met(x.stok_kodu)))];
  if (kodlar.length > 1) {
    const adaylar = kodlar.map(k => {
      const ad = met((satir.find(x => x.stok_kodu === k) || {}).stok_adi);
      return k + ' (' + ad + ')';
    });
    const e = new Error('bu numara birden fazla ürüne ait — stok kodunu yazın: ' + adaylar.join(' , '));
    e.adaylar = kodlar;
    throw e;
  }
  return { kod: kodlar[0], satir, musteriParca: giris };
}

// ── ERP verisinden kanit topla ───────────────────────────────────────────
async function erpKanit(giris) {
  const coz = await kodCoz(giris);
  const kod = coz.kod;
  const [rota, agac, fmea, dok] = await Promise.all([
    sb.from('operasyon_kartlari').select('stok_kodu,kayit_tarihi,gecerlilik_tarihi').eq('stok_kodu', kod).limit(50),
    sb.from('urun_agaclari').select('urun_kodu,kayit_tarihi').eq('urun_kodu', kod).limit(50),
    sb.from('pfmea_projects').select('id,name,data').limit(500),
    sb.from('stok_dokumanlari').select('doc_adi,link,rev_no,yayin_tarihi,tip,aktif').eq('stok_kodu', kod).limit(50),
  ]);
  const planSatir = coz.satir;
  const urunAdi = met((planSatir[0] || {}).stok_adi) || kod;
  // FMEA eslesmesi: proje kimligi, proje adi VEYA urun adi (musteri parca
  // numarasi "36.72010-6345 INDEX C" gibi) uzerinden.
  const kimlik = 'proj_' + kod.replace(/[.\-]/g, '_');
  const buyuk = x => met(x).toLocaleUpperCase('tr');
  const aranan = [buyuk(kod), buyuk(urunAdi)].filter(Boolean);
  const fmeaKayit = (fmea.data || []).find(p => {
    const f = (p.data && p.data.projectData && p.data.projectData.fmea) || {};
    if (met(f.projectId) === kimlik) return true;
    const metin = buyuk(f.project) + ' ' + buyuk(f.productName) + ' ' + buyuk(p.name);
    return aranan.some(a => metin.includes(a));
  });
  // ── Cizelge capasi: URUN DEVREYE ALMA tarihi ──────────────────────────
  // Urun zaten seri uretimde; APQP gelecege degil, devreye alma tarihine
  // dogru GERIYE kurulur. Oncelik: operasyon karti kayit tarihi (FR91'de son
  // adimin tarihiyle birebir ayni), sonra kontrol plani revizyonu, sonra
  // urun agaci kaydi. Hicbiri yoksa bugun.
  const tarihAdayi = [
    met((rota.data || [])[0] && (rota.data[0].kayit_tarihi || rota.data[0].gecerlilik_tarihi)),
    met((planSatir.find(x => met(x.tr_revtarih)) || {}).tr_revtarih),
    met((agac.data || [])[0] && agac.data[0].kayit_tarihi),
  ].map(t => t.slice(0, 10)).filter(t => /^\d{4}-\d{2}-\d{2}$/.test(t));
  const devreyeAlma = tarihAdayi[0] || bugun();

  const dokumanlar = (dok.data || []).filter(d => met(d.aktif) !== 'False').map(d => ({
    ad: met(d.doc_adi), yol: met(d.link), rev: met(d.rev_no), tarih: met(d.yayin_tarihi).slice(0, 10),
  }));

  return {
    kod, musteriParca: coz.musteriParca || '',
    urunAdi, devreyeAlma, tarihKaynagi: tarihAdayi.length ? (rota.data || []).length ? 'operasyon kartı' : 'kontrol planı' : 'bugün',
    dokumanlar,
    musteri: met((planSatir[0] || {}).cari_adi),
    plan: planSatir.length > 0,
    opkart: (rota.data || []).length > 0,
    agac: (agac.data || []).length > 0,
    fmea: !!fmeaKayit,
    fmeaId: fmeaKayit ? fmeaKayit.id : '',
    akis: !!fmeaKayit,   // akis diyagrami PFMEA modulunde uretiliyor
  };
}

// ── APQP kaydi uret ──────────────────────────────────────────────────────
async function apqpUret(giris) {
  const k = await erpKanit(giris);
  const kod = k.kod;
  const son = k.devreyeAlma;                       // urun devreye alma
  const bas = gunEkle(son, -TOPLAM_GUN);           // APQP baslangici
  const drive = await driveDosyalari(kod);         // Drive'daki kanit dokumanlari
  // Teknik resim adimlarina LeanSys stok dokumani baglanir
  const resim = k.dokumanlar.find(d => d.yol) || null;

  const bolumler = FR91.map(b => ({
    no: b.no, ad: b.ad,
    adimlar: b.adimlar.map(a => {
      const kanitVar = !!(a.kanit && k[a.kanit]);
      const bitis = gunEkle(son, -(TOPLAM_GUN - (FAZ[b.no] || 56)));
      const mod = modulBaglantisi(a.form);
      const resimAdimi = /teknik resim|şartname|sartname/i.test(met(a.form)) && resim;
      // KANITLAR: ERP modulu · LeanSys stok dokumani · Drive dokumani
      const kanitlar = [];
      if (mod) kanitlar.push({ tur: 'erp', ad: mod.ad, adres: mod.adres });
      if (resimAdimi) kanitlar.push({ tur: 'leansys', ad: resim.ad + (resim.rev ? ' · ' + resim.rev : ''), yol: resim.yol });
      adimDriveDosyalari(a.form, drive).forEach(d => kanitlar.push({ tur: 'drive', ad: d.ad, yol: d.yol }));
      // Kanit varsa adim tamamlanmis sayilir (ERP kaniti ya da dokuman)
      const tamam = kanitVar || kanitlar.some(x => x.tur !== 'erp');
      return {
        no: a.no, ad: a.ad, aiag: a.aiag, sorumluluk: a.sorumluluk,
        prosedur: a.prosedur, form: a.form, kanit: a.kanit || '',
        bitis,
        tamamlanma: tamam ? bitis : '',
        durum: tamam ? 100 : 0,
        kanitlar,
      };
    }),
  }));
  return {
    id: 'apqp_' + kod.replace(/[.\-]/g, '_'),
    stokKodu: kod, musteriParca: k.musteriParca || k.urunAdi,
    urunAdi: k.urunAdi, musteri: k.musteri, tarih: bas,
    devreyeAlma: son, tarihKaynagi: k.tarihKaynagi, dokumanlar: k.dokumanlar,
    ekip: EKIP, bolumler,
    kaynak: { fmea: k.fmea, kontrolPlani: k.plan, operasyonKarti: k.opkart, urunAgaci: k.agac },
  };
}

// FR91'deki ekip satirlari (sablonun kendi rolleri)
const EKIP = [{"rol": "AR&GE Proje Yöneticisi", "ad": "Sinem Kaya"}, {"rol": "Kalite Güvence Müdürü", "ad": "Volkan Pekatik"}, {"rol": "Kalite Mühendisi", "ad": "Emre Biçer"}, {"rol": "Satın Alma", "ad": "Kutlay Altıparmak"}, {"rol": "Lojistik", "ad": "Taner Şeşenoğlu"}, {"rol": "Üretim", "ad": "Mete Yılmaz"}, {"rol": "Satış", "ad": "Ender Zaimoğlu"}];

// ── Kayit / okuma ────────────────────────────────────────────────────────
async function kaydet(p) {
  const { error } = await sb.from('apqp_projeler')
    .upsert({ id: p.id, name: p.stokKodu + ' APQP', data: p }, { onConflict: 'id' });
  if (error) throw error;
}
async function hepsiniOku() {
  const { data, error } = await sb.from('apqp_projeler').select('id,name,data').order('id');
  if (error) throw error;
  return (data || []).map(x => x.data).filter(Boolean);
}

// ── Cizim ────────────────────────────────────────────────────────────────
let aktif = null, gorunum = 'liste';

function yuzde(p) {
  const hepsi = p.bolumler.flatMap(b => b.adimlar);
  if (!hepsi.length) return 0;
  return Math.round(hepsi.reduce((t, a) => t + (Number(a.durum) || 0), 0) / hepsi.length);
}

function ciz() {
  if (!aktif) { $('#baslikKart').hidden = $('#sekmeler').hidden = $('#listeKart').hidden = $('#ganttKart').hidden = true; return; }
  $('#baslikKart').hidden = $('#sekmeler').hidden = false;
  $('#bParca').textContent = aktif.stokKodu + (aktif.urunAdi ? ' — ' + aktif.urunAdi : '')
    + (aktif.musteriParca && aktif.musteriParca !== aktif.urunAdi ? '  (müşteri: ' + aktif.musteriParca + ')' : '');
  $('#bMusteri').textContent = aktif.musteri || '—';
  $('#bTarih').textContent = aktif.tarih;
  $('#bDevreye').textContent = (aktif.devreyeAlma || '—')
    + (aktif.tarihKaynagi ? ' (' + aktif.tarihKaynagi + ')' : '');
  const y = yuzde(aktif);
  $('#bYuzde').textContent = '%' + y;
  $('#bCubuk').style.width = y + '%';
  $('#bEkip').innerHTML = aktif.ekip.map(e => '<b>' + e.rol + ':</b> ' + (e.ad || '—')).join(' &nbsp;·&nbsp; ');
  const hepsi = aktif.bolumler.flatMap(b => b.adimlar);
  const kanitli = hepsi.filter(a => (a.kanitlar || []).length).length;
  $('#bKanit').textContent = kanitli + ' / ' + hepsi.length + ' adımda kanıt';
  $('#bDrive').textContent = driveKlasoru(aktif.stokKodu);
  $('#listeKart').hidden = gorunum !== 'liste';
  $('#ganttKart').hidden = gorunum !== 'gantt';
  if (gorunum === 'liste') cizListe(); else cizGantt();
}

function rozet(d) {
  const s = Number(d) || 0;
  const c = s >= 100 ? 'r100' : s > 0 ? 'r50' : 'r0';
  return '<span class="rozet ' + c + '">%' + s + '</span>';
}

function cizListe() {
  let h = '<table><thead><tr><th>No</th><th>Adım</th><th>AIAG</th><th>Sorumluluk</th>'
    + '<th>Prosedür</th><th>Form / Doküman</th><th>Bitiş</th><th>Tamamlanma</th><th>Durum</th></tr></thead><tbody>';
  aktif.bolumler.forEach(b => {
    h += '<tr class="bolum"><td class="no">' + b.no + '</td><td colspan="8">' + b.ad + '</td></tr>';
    b.adimlar.forEach(a => {
      const parca = ['<span class="form-ad">' + (a.form || '—') + '</span>'];
      (a.kanitlar || []).forEach(x => {
        if (x.tur === 'erp') parca.push('<a class="dosya" href="' + x.adres + '" target="_blank" title="ERP modülü">🔗 ' + x.ad + '</a>');
        else parca.push('<a class="dosya" href="#" data-ac="' + encodeURIComponent(x.yol) + '" title="'
          + (x.tur === 'drive' ? 'Drive dokümanı' : 'LeanSys stok dokümanı') + ' — yerel ajanla açılır">'
          + (x.tur === 'drive' ? '📁 ' : '📄 ') + x.ad + '</a>');
      });
      if (!(a.kanitlar || []).length) parca.push('<span style="color:#b45309;font-size:11px">kanıt yok</span>');
      const form = parca.join('<br>');
      h += '<tr>'
        + '<td class="no">' + a.no + '</td>'
        + '<td>' + a.ad + (a.kanit && a.durum >= 100 ? '<span class="kanit">ERP&#39;den</span>' : '') + '</td>'
        + '<td>' + (a.aiag || '') + '</td>'
        + '<td>' + (a.sorumluluk || '') + '</td>'
        + '<td>' + (a.prosedur || '') + '</td>'
        + '<td>' + form + '</td>'
        + '<td><input type="date" value="' + (a.bitis || '') + '" data-alan="bitis" data-no="' + a.no + '" data-b="' + b.no + '" style="width:140px"></td>'
        + '<td><input type="date" value="' + (a.tamamlanma || '') + '" data-alan="tamamlanma" data-no="' + a.no + '" data-b="' + b.no + '" style="width:140px"></td>'
        + '<td class="durum"><input type="number" min="0" max="100" step="25" value="' + (a.durum || 0) + '" data-alan="durum" data-no="' + a.no + '" data-b="' + b.no + '" style="width:64px"> ' + rozet(a.durum) + '</td>'
        + '</tr>';
    });
  });
  h += '</tbody></table>';
  $('#listeKart').innerHTML = h;
}

function cizGantt() {
  const hepsi = aktif.bolumler.flatMap(b => b.adimlar.map(a => ({ b: b.no, ...a })));
  const tarihler = hepsi.map(a => a.bitis).filter(Boolean).sort();
  if (!tarihler.length) { $('#ganttKart').innerHTML = 'Tarih yok.'; return; }
  const bas = new Date(aktif.tarih), son = new Date(tarihler[tarihler.length - 1]);
  const haftaSayisi = Math.max(1, Math.ceil((son - bas) / (7 * 864e5)) + 1);
  let h = '<table><thead><tr><th style="min-width:52px">No</th><th style="min-width:280px">Adım</th>';
  for (let w = 0; w < haftaSayisi; w++) h += '<th style="min-width:16px">' + (w + 1) + '</th>';
  h += '</tr></thead><tbody>';
  aktif.bolumler.forEach(b => {
    h += '<tr class="bolum"><td class="no">' + b.no + '</td><td colspan="' + (haftaSayisi + 1) + '">' + b.ad + '</td></tr>';
    b.adimlar.forEach(a => {
      const hafta = Math.max(0, Math.floor((new Date(a.bitis) - bas) / (7 * 864e5)));
      h += '<tr><td class="no">' + a.no + '</td><td>' + a.ad.slice(0, 70) + '</td>';
      for (let w = 0; w < haftaSayisi; w++) {
        h += '<td class="hf">' + (w === hafta ? '<div class="cubuk' + (a.durum >= 100 ? ' tamam' : '') + '"></div>' : '') + '</td>';
      }
      h += '</tr>';
    });
  });
  h += '</tbody></table>';
  $('#ganttKart').innerHTML = h;
}

// ── Olaylar ──────────────────────────────────────────────────────────────
document.addEventListener('change', async e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.alan || !aktif) return;
  const b = aktif.bolumler.find(x => x.no === t.dataset.b);
  const a = b && b.adimlar.find(x => x.no === t.dataset.no);
  if (!a) return;
  a[t.dataset.alan] = t.dataset.alan === 'durum' ? Number(t.value) : t.value;
  if (t.dataset.alan === 'durum' && a.durum >= 100 && !a.tamamlanma) a.tamamlanma = bugun();
  if (t.dataset.alan === 'durum' && a.durum < 100) a.tamamlanma = '';
  try { await kaydet(aktif); ciz(); } catch (err) { mesaj('Kaydedilemedi: ' + err.message); }
});

document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-ac]');
  if (!a) return;
  e.preventDefault();
  dosyaAc(decodeURIComponent(a.dataset.ac));
});

$('#sekmeler').addEventListener('click', e => {
  if (!e.target.dataset.gorunum) return;
  gorunum = e.target.dataset.gorunum;
  [...$('#sekmeler').children].forEach(b => b.className = b.dataset.gorunum === gorunum ? 'sec' : '');
  ciz();
});

$('#uretBtn').addEventListener('click', async () => {
  const kodlar = [...new Set($('#kod').value.split(/[,;\n]/).map(x => x.trim()).filter(Boolean))];
  if (!kodlar.length) { mesaj('Önce bir ürün kodu girin.'); return; }
  $('#uretBtn').disabled = true;
  const olan = await hepsiniOku();
  const basarili = [], atlanan = [], hatali = [];
  for (const kod of kodlar) {
    try {
      mesaj(kod + ' için ERP verisi okunuyor…');
      const p = await apqpUret(kod);
      // Tekrar kontrolu COZULMUS stok koduna gore: ayni urune musteri
      // numarasindan da girilse ikinci kayit acilmasin.
      if (olan.some(x => x.stokKodu === p.stokKodu)) { atlanan.push(kod + ' → ' + p.stokKodu); continue; }
      await kaydet(p);
      basarili.push(p);
    } catch (err) { hatali.push(kod + ': ' + err.message); }
  }
  $('#uretBtn').disabled = false;
  await projeleriYukle(basarili.length ? basarili[0].id : null);
  mesaj([
    basarili.length ? basarili.length + ' APQP oluşturuldu: ' + basarili.map(p => p.stokKodu).join(', ') : '',
    atlanan.length ? 'Atlandı (APQP&#39;si zaten var): ' + atlanan.join(', ') : '',
    hatali.length ? 'Üretilemeyen: ' + hatali.join(' | ') : '',
  ].filter(Boolean).join('<br>'));
});

$('#driveBtn').addEventListener('click', () => aktif && dosyaAc(driveKlasoru(aktif.stokKodu)));

// Drive'a yeni dokuman eklenince adimlara yeniden baglanir (durum korunur:
// elle %100 yapilmis adim geri alinmaz).
$('#tazeleBtn').addEventListener('click', async () => {
  if (!aktif) return;
  const drive = await driveDosyalari(aktif.stokKodu);
  let eklenen = 0;
  aktif.bolumler.forEach(b => b.adimlar.forEach(a => {
    const yeni = adimDriveDosyalari(a.form, drive)
      .filter(d => !(a.kanitlar || []).some(x => x.yol === d.yol));
    if (!yeni.length) return;
    a.kanitlar = (a.kanitlar || []).concat(yeni.map(d => ({ tur: 'drive', ad: d.ad, yol: d.yol })));
    eklenen += yeni.length;
    if (!a.durum) { a.durum = 100; a.tamamlanma = a.bitis; }
  }));
  await kaydet(aktif); ciz();
  mesaj(eklenen ? eklenen + ' yeni Drive dokümanı bağlandı.' : 'Drive klasöründe yeni doküman yok.');
});

$('#silBtn').addEventListener('click', async () => {
  const id = $('#projeSec').value;
  if (!id || !confirm('Bu APQP kaydı silinsin mi?')) return;
  await sb.from('apqp_projeler').delete().eq('id', id);
  await projeleriYukle(null);
});

$('#projeSec').addEventListener('change', async () => {
  const hepsi = await hepsiniOku();
  aktif = hepsi.find(p => p.id === $('#projeSec').value) || null;
  ciz();
});

async function projeleriYukle(secId) {
  let hepsi = [];
  try { hepsi = await hepsiniOku(); }
  catch (err) {
    mesaj('Tablo okunamadı: ' + err.message + '<br>apqp.sql dosyasındaki SQL&#39;i Supabase SQL Editor&#39;de bir kez çalıştırın.');
    return;
  }
  $('#projeSec').innerHTML = '<option value="">— APQP kaydı seçin —</option>'
    + hepsi.map(p => '<option value="' + p.id + '">' + p.stokKodu + ' — %' + yuzde(p) + '</option>').join('');
  if (secId) $('#projeSec').value = secId;
  aktif = hepsi.find(p => p.id === $('#projeSec').value) || null;
  ciz();
}

projeleriYukle(null);
</script>
