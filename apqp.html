<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APQP Takip — Sanifoam ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://mycosmosshop.github.io/erp-portal/erp-theme.js"></script>
<style>
:root{--bg:#f4f6fa;--kart:#fff;--kenar:#dde3ec;--metin:#1f2937;--soluk:#6b7280;--vurgu:#1e3c72}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--metin)}
.ust{background:var(--vurgu);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ust h1{font-size:17px;margin:0;font-weight:700}
.ust .bilgi{font-size:12px;opacity:.85}
button{font:inherit;border:1px solid var(--kenar);background:#fff;color:var(--metin);padding:6px 12px;border-radius:6px;cursor:pointer}
button.bas{background:#f59e0b;border-color:#f59e0b;color:#fff;font-weight:600}
button.bas:disabled{opacity:.6;cursor:default}
button.sec{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--kenar);border-radius:6px;background:#fff;color:var(--metin)}
.govde{padding:16px;max-width:1700px;margin:0 auto}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:10px;padding:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--kenar);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef2f8;font-weight:600;font-size:12px;position:sticky;top:0;z-index:2}
tr.bolum td{background:#dbe4f3;font-weight:700;font-size:13px}
td.no{white-space:nowrap;font-variant-numeric:tabular-nums;width:52px}
td.durum{width:110px;text-align:center}
.rozet{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.r0{background:#fee2e2;color:#991b1b}.r50{background:#fef3c7;color:#92400e}.r100{background:#dcfce7;color:#166534}
.kanit{font-size:11px;color:#166534;background:#dcfce7;border-radius:4px;padding:1px 5px;margin-left:4px}
.ilerleme{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin-top:7px}
.ilerleme i{display:block;height:100%;width:32%;border-radius:4px;
  background:linear-gradient(90deg,#1d4ed8,#60a5fa);animation:ilerKay 1.15s infinite ease-in-out}
@keyframes ilerKay{0%{margin-left:-32%}100%{margin-left:100%}}
.iler-sure{color:#64748b;font-size:11px}
.yukle-dugme{font-size:11px;color:#166534;background:#dcfce7;border-radius:4px;padding:1px 6px;
  margin-left:4px;text-decoration:none;white-space:nowrap}
.yukle-dugme:hover{background:#bbf7d0}
.aiag3{font-size:11px;color:#1e40af;background:#dbeafe;border-radius:4px;padding:1px 5px;margin-left:4px}
.form-ad{font-size:12px;color:var(--soluk)}
a.dosya{color:#1d4ed8;text-decoration:none}a.dosya:hover{text-decoration:underline}
a.ikon{color:#6b7280;text-decoration:none;font-size:11px;padding:1px 5px;border:1px solid var(--kenar);border-radius:4px}
a.ikon:hover{color:#1e3c72;border-color:#1e3c72}
a.sil-dugme{color:#b91c1c;font-weight:700;font-size:11px;text-decoration:none;padding:1px 8px;
  border:1px solid #f0a8a8;border-radius:4px;background:#fee2e2;white-space:nowrap}
a.sil-dugme:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
.gantt{overflow-x:auto}
.gantt table{font-size:11px}
.gantt td.hf{padding:0;height:20px;min-width:16px}
.cubuk{height:14px;border-radius:3px;background:#3b82f6}
.cubuk.tamam{background:#22c55e}
.durumcubugu{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:4px}
.durumcubugu i{display:block;height:100%;background:#22c55e}
.sekme{display:flex;gap:6px;margin-bottom:12px}
.uyari{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
</style></head>
<body>
<div class="ust">
  <h1>APQP Takip</h1>
  <span class="bilgi" id="fr91Bilgi">FR91 APQP-Takip Formu</span>
  <span style="flex:1"></span>
  <input id="kod" placeholder="Ürün kodu — birden fazlası için virgülle ayırın" style="min-width:340px">
  <button class="bas" id="uretBtn">APQP Oluştur</button>
  <select id="projeSec" style="min-width:220px"></select>
  <button id="silBtn" title="Seçili APQP kaydını sil">Sil</button>
</div>

<div class="govde">
  <div id="mesaj"></div>

  <div class="kart" id="baslikKart" hidden>
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      <div><b>Parça Numarası:</b> <span id="bParca">—</span></div>
      <div><b>Müşteri:</b> <span id="bMusteri">—</span></div>
      <div><b>Lokasyon:</b> <span id="bLokasyon">—</span></div>
      <div><b>APQP Tarihi:</b> <span id="bTarih">—</span></div>
      <div><b>Devreye Alma:</b> <span id="bDevreye">—</span></div>
      <div><b>Kanıt:</b> <span id="bKanit">—</span></div>
      <div><b>Tamamlanma:</b> <span id="bYuzde">—</span></div>
    </div>
    <div class="durumcubugu"><i id="bCubuk" style="width:0%"></i></div>
    <div style="margin-top:10px;font-size:12px;color:var(--soluk)" id="bEkip"></div>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button id="driveBtn">📁 Drive klasörünü aç</button>
      <button id="belgeBtn" title="Bu ürünün belgelerini ve MSA çalışmalarını yeniden üretir (Drive klasörüne yazar)">📄 Belgeleri üret</button>
      <button id="tazeleBtn" title="Belge ürettikten sonra basın: Drive'daki yeni dokümanları adımlara bağlar ve FR91'e sonradan eklenen adımları getirir. Kayıt açılırken zaten kendiliğinden çalışır.">🔄 Yenile</button>
      <label style="font-size:12px;display:inline-flex;align-items:center;gap:4px;margin-left:8px" title="AIAG APQP 3rd Edition (Mart 2024) ile eklenen 14 madde bölümlerin SONUNDA durur; bu kutu yalnız onları gösterir">
        <input type="checkbox" id="yeniSuzgec"> Yalnız yeni maddeler (AIAG 3rd Ed.)</label>
      <span style="font-size:12px;color:var(--soluk)" id="bDrive"></span>
    </div>
  </div>

  <div class="sekme" id="sekmeler" hidden>
    <button data-gorunum="pano">Pano</button>
    <button class="sec" data-gorunum="liste">Liste</button>
    <button data-gorunum="gantt">Gantt</button>
    <button data-gorunum="tarihce">Revizyon Tarihçesi</button>
  </div>

  <div class="kart" id="tarihceKart" hidden></div>

  <div class="kart" id="panoKart" hidden></div>

  <div class="kart" id="listeKart" hidden></div>
  <div class="kart gantt" id="ganttKart" hidden></div>
</div>

// Dosyalar ag yolunda (\\10.11.11.11\...) veya Drive'da; tarayici acamaz,
// yerel ajan acar. 127.0.0.1 tarayicilar icin guvenli origin sayilir.
// NOT: ajanin /open ucu YALNIZ LeanSys pencerelerini acar; dosya icin
// /dosyaac ucu kullanilir (izinli koklerle sinirli).
const DRIVE_KOK = "G:\\Drive'\u0131m\\APQP";
const driveKlasoru = kod => DRIVE_KOK + '\\' + kod;

async function ajanJson(yol) {
  const r = await fetch(AJAN + yol);
  if (!r.ok) throw new Error('ajan HTTP ' + r.status);
  return r.json();
}

async function dosyaAc(yol) {
  try {
    const j = await ajanJson('/dosyaac?path=' + encodeURIComponent(yol));
    if (!j.ok) throw new Error(j.hata || 'acilamadi');
    mesaj('');
  } catch (e) {
    mesaj('Dosya açılamadı (' + e.message + '). LeanSys ajanı çalışıyor mu?<br>Yol: <code>' + yol + '</code>');
  }
}

// Dokumani yeniden adlandirir / siler (ajan izinli koklerle sinirli).
async function dosyaYonet(islem, yol, ek) {
  const u = islem === 'sil'
    ? '/dosyasil?path=' + encodeURIComponent(yol)
    : '/dosyaadi?path=' + encodeURIComponent(yol) + '&yeni=' + encodeURIComponent(ek);
  const j = await ajanJson(u);
  if (!j.ok) throw new Error(j.hata || 'işlem başarısız');
}

// Urunun Drive klasorundeki dokumanlar. Ajan yoksa bos doner (uretim durmaz).
let driveDisi = 0;          // klasorde olup bu urune ait olmayan dosya sayisi
async function driveDosyalari(kod, musteriParca) {
  try {
    const j = await ajanJson('/dosyalar?dir=' + encodeURIComponent(driveKlasoru(kod)));
    const hepsi = j.ok ? (j.dosyalar || []) : [];
    // Excel/Word acikken birakilan kilit dosyalari (~$...) kanit degildir
    const ait = hepsi.filter(d => !/^~\$/.test(met(d.ad)) && buUruneAit(d.ad, kod, musteriParca));
    driveDisi = hepsi.length - ait.length;
    return ait;
  } catch { driveDisi = 0; return []; }
}

// Kod tasimayan dosyalar icin anahtar kelime esleri: [dosya adi, form metni]

// Klasordeki her dosya bu urune ait DEGIL: sablonlar ("FR90 Fizibilite
// Taahhudu.xlsm") ve baska urunlerin dokumanlari da ayni klasorde durabiliyor.
// Kanit sayilmasi icin dosya adinda BU urunun stok kodu veya musteri parca
// numarasi gecmeli. Nokta/tire/bosluk farklari yok sayilir.
const sadeKod = x => met(x).toLocaleLowerCase('tr').replace(/[\s._\-\/]/g, '');
function buUruneAit(dosyaAdi, kod, musteriParca) {
  const ad = sadeKod(dosyaAdi);
  // Musteri parca no urun adinin icinde gecebilir ("36.72010-6345 INDEX C");
  // dosya adinda genelde yalniz numara durur, o yuzden parcalara da bakilir.
  const anahtar = [kod].concat(met(musteriParca).split(/\s+/)).concat([musteriParca])
    .map(sadeKod).filter(k => k.length > 4 && /\d/.test(k));
  return anahtar.some(k => ad.includes(k));
}

// Belge adi ile form metnini karsilastirmak icin sadelestirme: urun kodu,
// uzanti, noktalama ve Turkce karakter farklari atilir.
const adSade = x => met(x)
  .replace(/\.[a-z]{3,4}$/i, '')
  .toLocaleLowerCase('tr')
  .replace(/[çğıöşü]/g, c => ({ 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u' }[c]))
  .replace(/[0-9]+[.\-][0-9.\-a-z]*/g, ' ')     // urun/musteri kodlari
  .replace(/[^a-z]+/g, ' ').trim();

// Bir adima ait Drive dokumanlari (dosyalar zaten urune gore suzulmus gelir)
function adimDriveDosyalari(form, dosyalar) {
  const kodlar = formKodlari(form);
  const fs = adSade(form);
  return dosyalar.filter(d => {
    if (kodlar.length && formKodlari(d.ad).some(k => kodlar.includes(k))) return true;
    if (DOSYA_ANAHTAR.some(([dk, fk]) => dk.test(d.ad) && fk.test(met(form)))) return true;
    // Belgeler form adiyla uretiliyor ("APQP Program Metrikleri <kod>.xlsx"):
    // anahtar kelime listesi tutmak yerine adlari dogrudan karsilastir.
    const ds = adSade(d.ad);
    return ds.length > 8 && fs.length > 8 && (ds.includes(fs) || fs.includes(ds));
  });
}

// Uretim suresince ilerleme cubugu + gecen sure. Ajan ara bilgi vermedigi
// icin yuzde YAZILMAZ; cubuk belirsiz (surekli akan) tiptedir.
let ilerlemeSayac = null;
function ilerlemeBasla(metin) {
  const t0 = Date.now();
  mesaj(metin + ' <span class="iler-sure" id="ilerSure">0 sn</span><div class="ilerleme"><i></i></div>');

    el.textContent = g < 60 ? g + ' sn' : Math.floor(g / 60) + ' dk ' + (g % 60) + ' sn';
  }, 1000);
}

// Girilen deger ic stok kodu OLABILIR, musteri parca numarasi da olabilir
// (LeanSys'te musteri numarasi stok_adi alaninda durur). Belirsizse tahmin
// yurutulmez; adaylar cagirana bildirilir.
async function kodCoz(giris) {
  const alan = 'stok_kodu,stok_adi,cari_adi,tr_revtarih';
  let r = await sb.from('leansys_kontrol_plani').select(alan).eq('stok_kodu', giris).limit(300);
  if ((r.data || []).length) return { kod: giris, satir: r.data };

  r = await sb.from('leansys_kontrol_plani').select(alan).ilike('stok_adi', '%' + giris + '%').limit(300);
  const satir = r.data || [];
  if (!satir.length) return { kod: giris, satir: [] };

  const kodlar = [...new Set(satir.map(x => met(x.stok_kodu)))];
  if (kodlar.length > 1) {
    const adaylar = kodlar.map(k => {
      const ad = met((satir.find(x => x.stok_kodu === k) || {}).stok_adi);
      return k + ' (' + ad + ')';
    });
    const e = new Error('bu numara birden fazla ürüne ait — stok kodunu yazın: ' + adaylar.join(' , '));
    e.adaylar = kodlar;
    throw e;
  }
  return { kod: kodlar[0], satir, musteriParca: giris };
}

// ── MSA calismalari (GageAI modulu, ayni Supabase) ───────────────────────
// Kontrol planindaki olcum yontemi (KOMPARATOR, SERITMETRE, GOZLE...) ile
// calismanin alet adi/karakteristigi/adi eslesirse o adima baglanir.
const MSA_ADRES = 'https://mycosmosshop.github.io/msa/results.html?id=';
const MSA_ROZET = { acceptable: '✓ kabul', marginal: '⚠ şartlı', unacceptable: '✗ red' };

// Calisma BU URUNE ait olmali. Yalniz alet adina bakmak, ayni isimli aleti
// (GOZLE, SERITMETRE...) kullanan BASKA urunun calismasini bu urunun kanitiymis
// gibi gosteriyordu.
function msaEslesir(c, kod, parca) {
  const b = x => met(x).toLocaleUpperCase('tr');
  const metin = [c.gauge_name, c.gauge_number, c.characteristic, c.part_name, c.study_name]
    .map(b).join(' ');
  return [kod].concat(met(parca).split(/\s+/))
    .filter(a => a.length > 4 && /\d/.test(a))
    .some(a => metin.includes(b(a)));
}

async function msaCalismalari(kod, parca) {
  const r = await sb.from('msa_studies')
    .select('id,study_name,study_type,status,is_acceptable,gauge_name,gauge_number,'
      + 'characteristic,part_name,study_date,location')
    .is('copied_from_id', null).limit(500);
  return (r.data || []).filter(c => msaEslesir(c, kod, parca));
}

// ── ERP verisinden kanit topla ───────────────────────────────────────────
async function erpKanit(giris) {
  const coz = await kodCoz(giris);
  const kod = coz.kod;
  const [rota, agac, fmea, dok] = await Promise.all([
    sb.from('operasyon_kartlari').select('stok_kodu,makine_adi,kayit_tarihi,gecerlilik_tarihi').eq('stok_kodu', kod).limit(80),
    sb.from('urun_agaclari').select('urun_kodu,kayit_tarihi').eq('urun_kodu', kod).limit(50),
    sb.from('pfmea_projects').select('id,name,data').limit(500),
    sb.from('stok_dokumanlari').select('doc_adi,link,rev_no,yayin_tarihi,tip,aktif').eq('stok_kodu', kod).limit(50),
  ]);
  const planSatir = coz.satir;
  const urunAdi = met((planSatir[0] || {}).stok_adi) || kod;
  // Kontrol planindaki olcum yontemleri — MSA calismalariyla eslestirmek icin
  const yont = await sb.from('leansys_kontrol_plani').select('yontem').eq('stok_kodu', kod).limit(400);
  const aletler = [...new Set((yont.data || []).map(x => met(x.yontem).trim()).filter(Boolean))];
  // FMEA eslesmesi: proje kimligi, proje adi VEYA urun adi (musteri parca
  // numarasi "36.72010-6345 INDEX C" gibi) uzerinden.
  const kimlik = 'proj_' + kod.replace(/[.\-]/g, '_');
  const buyuk = x => met(x).toLocaleUpperCase('tr');
  const aranan = [buyuk(kod), buyuk(urunAdi)].filter(Boolean);
  const fmeaKayit = (fmea.data || []).find(p => {
    const f = (p.data && p.data.projectData && p.data.projectData.fmea) || {};
    if (met(f.projectId) === kimlik) return true;
    const metin = buyuk(f.project) + ' ' + buyuk(f.productName) + ' ' + buyuk(p.name);
    return aranan.some(a => metin.includes(a));
  });
  // ── Cizelge capasi: URUN DEVREYE ALMA tarihi ──────────────────────────
  // Urun zaten seri uretimde; APQP gelecege degil, devreye alma tarihine
  // dogru GERIYE kurulur. Oncelik: operasyon karti kayit tarihi (FR91'de son
  // adimin tarihiyle birebir ayni), sonra kontrol plani revizyonu, sonra
  // urun agaci kaydi. Hicbiri yoksa bugun.
  const tarihAdayi = [
    met((rota.data || [])[0] && (rota.data[0].kayit_tarihi || rota.data[0].gecerlilik_tarihi)),
    met((planSatir.find(x => met(x.tr_revtarih)) || {}).tr_revtarih),
    met((agac.data || [])[0] && agac.data[0].kayit_tarihi),
  ].map(t => t.slice(0, 10)).filter(t => /^\d{4}-\d{2}-\d{2}$/.test(t));
  const devreyeAlma = tarihAdayi[0] || bugun();

  const dokumanlar = (dok.data || []).filter(d => met(d.aktif) !== 'False').map(d => ({
    ad: met(d.doc_adi), yol: met(d.link), rev: met(d.rev_no), tarih: met(d.yayin_tarihi).slice(0, 10),
  }));

  const makineler = (rota.data || []).map(x => met(x.makine_adi)).filter(Boolean);
  return {
    kod, musteriParca: coz.musteriParca || '', aletler,
    msa: await msaCalismalari(kod, coz.musteriParca),
    lokasyon: lokasyonCoz(makineler),
    urunAdi, devreyeAlma, tarihKaynagi: tarihAdayi.length ? (rota.data || []).length ? 'operasyon kartı' : 'kontrol planı' : 'bugün',
    dokumanlar,
    musteri: met((planSatir[0] || {}).cari_adi),
    plan: planSatir.length > 0,
    opkart: (rota.data || []).length > 0,
    agac: (agac.data || []).length > 0,
    fmea: !!fmeaKayit,
    fmeaId: fmeaKayit ? fmeaKayit.id : '',
    akis: !!fmeaKayit,   // akis diyagrami PFMEA modulunde uretiliyor
  };
}

// ── APQP kaydi uret ──────────────────────────────────────────────────────
async function apqpUret(giris) {
  const k = await erpKanit(giris);
  const kod = k.kod;
  const son = k.devreyeAlma;                       // urun devreye alma
  const bas = gunEkle(son, -TOPLAM_GUN);           // APQP baslangici
  const drive = await driveDosyalari(kod, k.musteriParca);     // yalniz BU urune ait dokumanlar
  // Teknik resim adimlarina LeanSys stok dokumani baglanir
  const resim = k.dokumanlar.find(d => d.yol) || null;

  const bolumler = FR91.map(b => ({
    no: b.no, ad: b.ad,
    adimlar: b.adimlar.map(a => {
      const kanitVar = !!(a.kanit && k[a.kanit]);
      const bitis = gunEkle(son, -(TOPLAM_GUN - (FAZ[b.no] || 56)));
      const mod = modulBaglantisi(a.form);
      const resimAdimi = /teknik resim|şartname|sartname/i.test(met(a.form)) && resim;
      // KANITLAR: ERP modulu · LeanSys stok dokumani · Drive dokumani
      const kanitlar = [];
      if (mod) {
        // FMEA adimlarinda modulu degil, DOGRUDAN o urunun projesini ac
        const adres = /fmea|akış diyagram|akis diyagram/i.test(met(a.form)) && k.fmeaId
          ? mod.adres + '?proje=' + encodeURIComponent(k.fmeaId) : mod.adres;
        kanitlar.push({ tur: 'erp', ad: mod.ad, adres });
      }
      // MSA adimlarina modulun genel baglantisi degil, GERCEK calismalar baglanir
      if (/msa|gage ?r&?r|fr ?86|ölçüm sistemi/i.test(met(a.form) + ' ' + met(a.ad))) {
        (k.msa || []).forEach(c => kanitlar.push({
          tur: 'erp',
          ad: 'MSA: ' + met(c.study_name)
            + (c.is_acceptable ? ' (' + (MSA_ROZET[c.is_acceptable] || c.is_acceptable) + ')' : ''),
          adres: MSA_ADRES + c.id,
        }));
      }
      if (resimAdimi) kanitlar.push({ tur: 'leansys', ad: resim.ad + (resim.rev ? ' · ' + resim.rev : ''), yol: resim.yol });
      adimDriveDosyalari(a.form, drive).forEach(d => kanitlar.push({ tur: 'drive', ad: d.ad, yol: d.yol }));
      // Kanit varsa adim tamamlanmis sayilir (ERP kaniti ya da dokuman)
      const tamam = kanitVar || kanitlar.some(x => x.tur !== 'erp');
      return {
        no: a.no, ad: a.ad, aiag: a.aiag, sorumluluk: a.sorumluluk,
        prosedur: a.prosedur, form: a.form, kanit: a.kanit || '',
        bitis,
        tamamlanma: tamam ? bitis : '',
        durum: tamam ? 100 : 0,
        kanitlar,
      };
    }),
  }));
  return {
    id: 'apqp_' + kod.replace(/[.\-]/g, '_'),
    stokKodu: kod, musteriParca: k.musteriParca || k.urunAdi,
    urunAdi: k.urunAdi, musteri: k.musteri, tarih: bas,
    devreyeAlma: son, tarihKaynagi: k.tarihKaynagi, dokumanlar: k.dokumanlar,
    tarihce: [{
      rev: '0', tarih: bugun(),
      aciklama: 'APQP ERP’den üretildi — ' + FR91.reduce((t, b) => t + b.adimlar.length, 0)
        + ' adım, ' + FR91.length + ' bölüm',
      neden: 'İlk yayın (ürün ağacı + operasyon kartı + kontrol planı)',
      talep: '', onay: '',
    }],
    lokasyon: k.lokasyon || '',
    ekip: EKIP, bolumler,
    kaynak: { fmea: k.fmea, kontrolPlani: k.plan, operasyonKarti: k.opkart, urunAgaci: k.agac },
  };
}

// FR91'deki ekip satirlari (sablonun kendi rolleri)
const EKIP = [{"rol": "AR&GE Proje Yöneticisi", "ad": "Sinem Kaya"}, {"rol": "Kalite Güvence Müdürü", "ad": "Volkan Pekatik"}, {"rol": "Kalite Mühendisi", "ad": "Emre Biçer"}, {"rol": "Satın Alma", "ad": "Kutlay Altıparmak"}, {"rol": "Lojistik", "ad": "Taner Şeşenoğlu"}, {"rol": "Üretim", "ad": "Mete Yılmaz"}, {"rol": "Satış", "ad": "Ender Zaimoğlu"}];

// ── Kayit / okuma ────────────────────────────────────────────────────────
async function kaydet(p) {
  const { error } = await sb.from('apqp_projeler')
    .upsert({ id: p.id, name: p.stokKodu + ' APQP', data: p }, { onConflict: 'id' });
  if (error) throw error;
}
async function hepsiniOku() {
  const { data, error } = await sb.from('apqp_projeler').select('id,name,data').order('id');
  if (error) throw error;
  return (data || []).map(x => x.data).filter(Boolean);
}

let aktif = null, gorunum = 'liste';
// Baslik FR91 listesinden hesaplanir; liste revize olunca elle guncelleme gerekmesin
$('#fr91Bilgi').textContent = 'FR91 APQP-Takip Formu · '
  + FR91.reduce((t, b) => t + b.adimlar.length, 0) + ' adım / ' + FR91.length + ' bölüm';

function yuzde(p) {
  const hepsi = p.bolumler.flatMap(b => b.adimlar);
  if (!hepsi.length) return 0;
  return Math.round(hepsi.reduce((t, a) => t + (Number(a.durum) || 0), 0) / hepsi.length);
}

function ciz() {
  if (!aktif) {
    $('#baslikKart').hidden = $('#sekmeler').hidden = $('#listeKart').hidden
      = $('#ganttKart').hidden = $('#tarihceKart').hidden = true;
    // Pano da tazelenir: son kayıt silindiğinde eski tablo ekranda kalıyordu
    $('#panoKart').hidden = false;
    cizPano();
    return;
  }
  $('#baslikKart').hidden = $('#sekmeler').hidden = false;
  $('#bParca').textContent = aktif.stokKodu + (aktif.urunAdi ? ' — ' + aktif.urunAdi : '')
    + (aktif.musteriParca && aktif.musteriParca !== aktif.urunAdi ? '  (müşteri: ' + aktif.musteriParca + ')' : '');
  $('#bMusteri').textContent = aktif.musteri || '—';
  $('#bLokasyon').textContent = aktif.lokasyon || '—';
  $('#bTarih').textContent = aktif.tarih;
  $('#bDevreye').textContent = (aktif.devreyeAlma || '—')
    + (aktif.tarihKaynagi ? ' (' + aktif.tarihKaynagi + ')' : '');
  const y = yuzde(aktif);
  $('#bYuzde').textContent = '%' + y;
  $('#bCubuk').style.width = y + '%';
  $('#bEkip').innerHTML = aktif.ekip.map(e => '<b>' + e.rol + ':</b> ' + (e.ad || '—')).join(' &nbsp;·&nbsp; ');
  const hepsi = aktif.bolumler.flatMap(b => b.adimlar);
  const kanitli = hepsi.filter(a => (a.kanitlar || []).length).length;
  $('#bKanit').textContent = kanitli + ' / ' + hepsi.length + ' adımda kanıt';
  $('#bDrive').textContent = driveKlasoru(aktif.stokKodu);
  $('#panoKart').hidden = gorunum !== 'pano';
  $('#listeKart').hidden = gorunum !== 'liste';
  $('#ganttKart').hidden = gorunum !== 'gantt';
  $('#tarihceKart').hidden = gorunum !== 'tarihce';
  $('#baslikKart').hidden = gorunum === 'pano';
  if (gorunum === 'pano') cizPano();
  else if (gorunum === 'liste') cizListe();
  else if (gorunum === 'tarihce') cizTarihce();
  else cizGantt();
}

function rozet(d) {
  const s = Number(d) || 0;
  const c = s >= 100 ? 'r100' : s > 0 ? 'r50' : 'r0';
  return '<span class="rozet ' + c + '">%' + s + '</span>';
}

// Pano: tum APQP kayitlari tek listede
let panoKayitlari = [];
function cizPano() {
  if (!panoKayitlari.length) { $('#panoKart').innerHTML = 'Henüz APQP kaydı yok.'; return; }
  const satir = panoKayitlari.map(p => {
    const y = yuzde(p);
    return '<tr data-ac-proje="' + p.id + '" style="cursor:pointer">'
      + '<td><b>' + p.stokKodu + '</b></td>'
      + '<td>' + (p.urunAdi || '') + '</td>'
      + '<td>' + (p.musteri || '') + '</td>'
      + '<td>' + (p.lokasyon || '<span style="color:#b45309">—</span>') + '</td>'
      + '<td class="no">' + (p.tarih || '') + '</td>'
      + '<td class="no">' + (p.devreyeAlma || '') + '</td>'
      + '<td class="durum">' + rozet(y) + '</td>'
      + '<td class="durum"><a href="#" class="sil-dugme" data-proje-sil="' + p.id
      + '" title="Bu APQP kaydını sil">Sil</a></td>'

// Revizyon tarihçesi — AIAG APQP 3rd Ed. 1.15 (değişiklik günlüğü):
// neden, talep eden, onaylayan, tarih. Değişiklik talebi/onayı FR148 ile
// yürütülür; buradaki kayıt APQP çıktısının kendi günlüğüdür.
function cizTarihce() {
  const t = aktif.tarihce || [];
  const alan = (r, k, v, tur) => '<td><input ' + (tur || 'type="text"')
    + ' value="' + String(v == null ? '' : v).replace(/"/g, '&quot;')
    + '" data-tarihce="' + r + '" data-alan="' + k + '" style="width:100%;border:0;background:transparent"></td>';
  const satir = t.map((x, i) =>
    '<tr>' + alan(i, 'rev', x.rev) + alan(i, 'tarih', x.tarih, 'type="date"')
    + alan(i, 'aciklama', x.aciklama) + alan(i, 'neden', x.neden)
    + alan(i, 'talep', x.talep) + alan(i, 'onay', x.onay)
    + '<td class="durum"><a href="#" class="sil-dugme" data-tarihce-sil="' + i + '" title="Satırı sil">Sil</a></td></tr>'
  ).join('');

    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'
    + '<button id="tarihceEkle">+ Revizyon satırı ekle</button>'
    + '<span style="font-size:12px;color:var(--soluk)">AIAG APQP 3rd Ed. 1.15 — her APQP çıktısında '
    + 'değişiklik günlüğü: neden, talep eden, onaylayan, tarih. Değişiklik talebi FR148 ile yürütülür.</span></div>'
    + '<table><thead><tr><th style="width:70px">Rev.</th><th style="width:130px">Tarih</th>'
    + '<th>Değişiklik Açıklaması</th><th style="width:220px">Değişiklik Nedeni</th>'
    + '<th style="width:150px">Talep Eden</th><th style="width:150px">Onaylayan</th><th></th></tr></thead>'
    + '<tbody>' + (satir || '<tr><td colspan="7" style="color:var(--soluk)">Kayıt yok.</td></tr>')
    + '</tbody></table>';
}

function cizListe() {
  let h = '<table><thead><tr><th>No</th><th>Adım</th><th>AIAG</th><th>Sorumluluk</th>'
    + '<th>Prosedür</th><th>Form / Doküman</th><th>Bitiş</th><th>Tamamlanma</th><th>Durum</th></tr></thead><tbody>';
  const yalnizYeni = $('#yeniSuzgec') && $('#yeniSuzgec').checked;
  aktif.bolumler.forEach(b => {
    const adimlar = yalnizYeni ? b.adimlar.filter(a => a.aiag3) : b.adimlar;
    if (!adimlar.length) return;
    h += '<tr class="bolum"><td class="no">' + b.no + '</td><td colspan="8">' + b.ad + '</td></tr>';
    adimlar.forEach(a => {
      const parca = ['<span class="form-ad">' + (a.form || '—') + '</span>'];
      (a.kanitlar || []).forEach(x => {
        if (x.tur === 'erp') parca.push('<a class="dosya" href="' + x.adres + '" target="_blank" title="ERP modülü">🔗 ' + x.ad + '</a>');
        else {
          const ac = '<a class="dosya" href="#" data-ac="' + encodeURIComponent(x.yol) + '" title="'
            + (x.tur === 'drive' ? 'Aç ve düzenle — Excel/Word’de açılır, kaydedince Drive’a gider'
                                 : 'LeanSys stok dokümanı — yerel ajanla açılır') + '">'
            + (x.tur === 'drive' ? '📁 ' : '📄 ') + x.ad + '</a>';
          // Drive dokümanı düzenlenebilir/silinebilir; LeanSys dokümanına dokunulmaz
          // Dokümana tıklayınca Excel/Word'de açılır, orada düzenlenip kaydedilir
          // (Drive senkronlar). Ayrıca yeniden adlandırmaya gerek yok.
          const dugme = x.tur === 'drive'
            ? ' <a href="#" class="sil-dugme" data-sil="' + encodeURIComponent(x.yol) + '" title="Geri Dönüşüm Kutusu&#39;na taşı">sil</a>'
            : '';
          parca.push(ac + dugme);
        }
      });
      // Her adima doküman yüklenebilir; kanıtı olmayan adımda tek seçenek budur
      parca.push('<a href="#" class="yukle-dugme" data-yukle="' + encodeURIComponent(b.no + '|' + a.no)
        + '" title="Bilgisayardan doküman seçin — ürünün Drive klasörüne kaydedilir ve bu adıma bağlanır">'
        + '⬆ doküman yükle</a>');
      const form = parca.join('<br>');
      h += '<tr>'
        + '<td class="no">' + a.no + '</td>'
        + '<td>' + a.ad
        + (a.kanit && a.durum >= 100 ? '<span class="kanit">ERP&#39;den</span>' : '')
        + (a.aiag3 ? '<span class="aiag3" title="AIAG APQP 3rd Edition (Mart 2024) ile eklendi">AIAG 3rd Ed.</span>' : '')
        + '</td>'
        + '<td>' + (a.aiag || '') + '</td>'
        + '<td>' + (a.sorumluluk || '') + '</td>'
        + '<td>' + (a.prosedur || '') + '</td>'
        + '<td>' + form + '</td>'
        + '<td><input type="date" value="' + (a.bitis || '') + '" data-alan="bitis" data-no="' + a.no + '" data-b="' + b.no + '" style="width:140px"></td>'
        + '<td><input type="date" value="' + (a.tamamlanma || '') + '" data-alan="tamamlanma" data-no="' + a.no + '" data-b="' + b.no + '" style="width:140px"></td>'
        + '<td class="durum"><input type="number" min="0" max="100" step="25" value="' + (a.durum || 0) + '" data-alan="durum" data-no="' + a.no + '" data-b="' + b.no + '" style="width:64px"> ' + rozet(a.durum) + '</td>'
        + '</tr>';
    });
  });
  h += '</tbody></table>';
  $('#listeKart').innerHTML = h;
}

function cizGantt() {
  const hepsi = aktif.bolumler.flatMap(b => b.adimlar.map(a => ({ b: b.no, ...a })));
  const tarihler = hepsi.map(a => a.bitis).filter(Boolean).sort();
  if (!tarihler.length) { $('#ganttKart').innerHTML = 'Tarih yok.'; return; }
  const bas = new Date(aktif.tarih), son = new Date(tarihler[tarihler.length - 1]);
  const haftaSayisi = Math.max(1, Math.ceil((son - bas) / (7 * 864e5)) + 1);
  let h = '<table><thead><tr><th style="min-width:52px">No</th><th style="min-width:280px">Adım</th>';
  for (let w = 0; w < haftaSayisi; w++) h += '<th style="min-width:16px">' + (w + 1) + '</th>';
  h += '</tr></thead><tbody>';
  aktif.bolumler.forEach(b => {
    h += '<tr class="bolum"><td class="no">' + b.no + '</td><td colspan="' + (haftaSayisi + 1) + '">' + b.ad + '</td></tr>';
    b.adimlar.forEach(a => {
      const hafta = Math.max(0, Math.floor((new Date(a.bitis) - bas) / (7 * 864e5)));
      h += '<tr><td class="no">' + a.no + '</td><td>' + a.ad.slice(0, 70) + '</td>';
      for (let w = 0; w < haftaSayisi; w++) {
        h += '<td class="hf">' + (w === hafta ? '<div class="cubuk' + (a.durum >= 100 ? ' tamam' : '') + '"></div>' : '') + '</td>';
      }
      h += '</tr>';
    });
  });
  h += '</tbody></table>';
  $('#ganttKart').innerHTML = h;
}

// ── Olaylar ──────────────────────────────────────────────────────────────
document.addEventListener('click', async e => {
  if (e.target && e.target.id === 'tarihceEkle' && aktif) {
    aktif.tarihce = (aktif.tarihce || []).concat([{
      rev: String((aktif.tarihce || []).length), tarih: bugun(),
      aciklama: '', neden: '', talep: '', onay: '',
    }]);
    await kaydet(aktif); ciz();
    return;
  }
  const ts = e.target.closest && e.target.closest('a[data-tarihce-sil]');
  if (ts && aktif) {
    e.preventDefault();
    const i = Number(ts.dataset.tarihceSil);
    if (!confirm('Bu revizyon satırı silinsin mi?')) return;
    aktif.tarihce.splice(i, 1);
    await kaydet(aktif); ciz();
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.tarihce !== undefined && aktif) {
    const i = Number(t.dataset.tarihce);
    if (aktif.tarihce && aktif.tarihce[i]) {
      aktif.tarihce[i][t.dataset.alan] = t.value;
      await kaydet(aktif);
    }
    return;
  }
  if (!t.dataset || !t.dataset.alan || !aktif) return;
  const b = aktif.bolumler.find(x => x.no === t.dataset.b);
  const a = b && b.adimlar.find(x => x.no === t.dataset.no);
  if (!a) return;
  a[t.dataset.alan] = t.dataset.alan === 'durum' ? Number(t.value) : t.value;
  if (t.dataset.alan === 'durum' && a.durum >= 100 && !a.tamamlanma) a.tamamlanma = bugun();
  if (t.dataset.alan === 'durum' && a.durum < 100) a.tamamlanma = '';
  try { await kaydet(aktif); ciz(); } catch (err) { mesaj('Kaydedilemedi: ' + err.message); }
});

document.addEventListener('click', e => {
  const psil = e.target.closest && e.target.closest('a[data-proje-sil]');
  if (psil) {
    e.preventDefault(); e.stopPropagation();
    const id = psil.dataset.projeSil;
    const kayit = panoKayitlari.find(x => x.id === id);
    projeSil(id, kayit);
    return;
  }
  const tr = e.target.closest && e.target.closest('tr[data-ac-proje]');
  if (tr) {
    $('#projeSec').value = tr.dataset.acProje;

    gorunum = 'liste';
    [...$('#sekmeler').children].forEach(b => b.className = b.dataset.gorunum === gorunum ? 'sec' : '');
    ciz();
    return;
  }
  const yad = e.target.closest && e.target.closest('a[data-ad]');
  if (yad) {
    e.preventDefault();
    const yol = decodeURIComponent(yad.dataset.ad);
    const eski = yol.split('\\').pop();
    const yeni = prompt('Yeni dosya adı:', eski);
    if (!yeni || yeni === eski) return;
    dosyaYonet('ad', yol, yeni)
      .then(() => { mesaj('Yeniden adlandırıldı. Kanıtları tazeleyin.'); return kanitTazele(); })
      .catch(err => mesaj('Yeniden adlandırılamadı: ' + err.message));
    return;
  }
  const yyuk = e.target.closest && e.target.closest('a[data-yukle]');
  if (yyuk) {
    e.preventDefault();
    const [bno, ano] = decodeURIComponent(yyuk.dataset.yukle).split('|');
    dokumanYukle(bno, ano);
    return;
  }
  const ysil = e.target.closest && e.target.closest('a[data-sil]');
  if (ysil) {
    e.preventDefault();
    const yol = decodeURIComponent(ysil.dataset.sil);
    if (!confirm('Bu doküman Geri Dönüşüm Kutusu\'na taşınsın mı?\n\n' + yol)) return;
    dosyaYonet('sil', yol)
      .then(() => { mesaj('Geri Dönüşüm Kutusu&#39;na taşındı.'); return kanitTazele(); })
      .catch(err => mesaj('Silinemedi: ' + err.message));
    return;
  }
  const a = e.target.closest && e.target.closest('a[data-ac]');
  if (!a) return;
  e.preventDefault();
  dosyaAc(decodeURIComponent(a.dataset.ac));
});

// APQP kaydini siler; istenirse Drive klasorunu de Geri Donusum Kutusu'na
// tasir. Klasor kalirsa yeniden uretimde eski dokumanlar da orada durur —
// uretim ayni adli dosyalarin uzerine yazar ama artik uretilmeyenler kalir.
async function projeSil(id, kayit) {
  const kod = kayit ? kayit.stokKodu : id;
  if (!confirm('Bu APQP kaydı silinsin mi?\n\n' + kod)) return;
  const klasor = kayit ? driveKlasoru(kayit.stokKodu) : '';
  const klasorDe = klasor && confirm('Drive klasörü de kaldırılsın mı?\n\n' + klasor
    + '\n\nGeri Dönüşüm Kutusu&#39;na taşınır (geri alınabilir).\n'
    + 'Hayır derseniz dokümanlar kalır; yeniden ürettiğinizde üzerlerine yazılır.');
  const r = await sb.from('apqp_projeler').delete().eq('id', id);
  if (r.error) { mesaj('Kayıt silinemedi: ' + r.error.message); return; }
  let ek = ' Drive klasörü olduğu gibi duruyor.';
  if (klasorDe) {
    try { await dosyaYonet('sil', klasor); ek = ' Drive klasörü Geri Dönüşüm Kutusu&#39;na taşındı.'; }
    catch (err) { ek = ' Drive klasörü kaldırılamadı: ' + err.message; }
  }
  aktif = null;
  await projeleriYukle(null);
  mesaj(kod + ' APQP kaydı silindi.' + ek);
}

// Uretim ciktisindaki "uretildi" satirlarini sayar. Cikti kodlamasi bozulursa
// isaretler eslesmeyebilir; o durumda satir sayisina duser (0 yazmaz).
function uretimSayisi(satir) {
  const n = satir.filter(x => /^\s*[✓+]/.test(x)).length;
  return n || satir.filter(x => /^\s*[^\s]/.test(x)).length;
}

// Belgeleri + MSA calismalarini uretir (yerel ajan apqp_belge_uret.py'yi calistirir).
// Uretim uzun surer (Excel COM, MSA hesabi): tek istekte 10 dakikaya kadar.
async function belgeleriUret(kod) {
  const c = await fetch(AJAN + '/apqpuret?kod=' + encodeURIComponent(kod));
  const j = await c.json();
  if (!j.ok) throw new Error(j.hata || 'üretilemedi');
  return j.satirlar || [];
}

// Bilgisayardan doküman secip urunun Drive klasorune yazar, adima baglar.
// Ad, urun kodunu tasimazsa eklenir: kanit suzgeci yalniz urune ait dosyalari
// kabul ediyor, aksi halde yuklenen dosya bir sonraki yenilemede dusuyordu.
function dokumanYukle(bno, ano) {
  if (!aktif) return;
  const sec = document.createElement('input');
  sec.type = 'file';
  sec.onchange = async () => {
    const f = sec.files && sec.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { mesaj('Dosya 20 MB üzerinde — Drive klasörüne elle kopyalayın.'); return; }
    let ad = f.name;
    if (!buUruneAit(ad, aktif.stokKodu, aktif.musteriParca)) {
      const nk = ad.lastIndexOf('.');
      ad = (nk > 0 ? ad.slice(0, nk) : ad) + ' ' + aktif.stokKodu + (nk > 0 ? ad.slice(nk) : '');
    }
    ilerlemeBasla('Yükleniyor: ' + ad);
    try {
      const tampon = await f.arrayBuffer();
      const bayt = new Uint8Array(tampon);
      let ham = '';
      for (let i = 0; i < bayt.length; i += 8192) ham += String.fromCharCode.apply(null, bayt.subarray(i, i + 8192));
      const c = await fetch(AJAN + '/dosyayuk?dir=' + encodeURIComponent(driveKlasoru(aktif.stokKodu))
        + '&ad=' + encodeURIComponent(ad), { method: 'POST', body: btoa(ham) });
      const j = await c.json();
      if (!j.ok) throw new Error(j.hata || 'yazılamadı');
      const b = aktif.bolumler.find(x => x.no === bno);
      const a = b && b.adimlar.find(x => x.no === ano);
      if (a) {
        a.kanitlar = (a.kanitlar || []).concat([{ tur: 'drive', ad: j.ad, yol: j.yol }]);
        a.durum = 100;
        if (!a.tamamlanma) a.tamamlanma = bugun();
      }
      await kaydet(aktif); ciz();
      mesaj('Yüklendi: ' + j.ad + ' — adım ' + ano + ' tamamlandı olarak işaretlendi.');
    } catch (err) {
      mesaj('Yüklenemedi: ' + err.message + ' (yerel ajan çalışıyor mu?)');
    } finally { ilerlemeBitir(); }
  };
  sec.click();
}

$('#sekmeler').addEventListener('click', e => {
  if (!e.target.dataset.gorunum) return;
  gorunum = e.target.dataset.gorunum;
  [...$('#sekmeler').children].forEach(b => b.className = b.dataset.gorunum === gorunum ? 'sec' : '');
  ciz();
});

$('#uretBtn').addEventListener('click', async () => {
  const kodlar = [...new Set($('#kod').value.split(/[,;\n]/).map(x => x.trim()).filter(Boolean))];
  if (!kodlar.length) { mesaj('Önce bir ürün kodu girin.'); return; }
  $('#uretBtn').disabled = true;
  const olan = await hepsiniOku();
  const basarili = [], atlanan = [], hatali = [], uretim = [];
  let uretimAyrinti = [];
  for (const kod of kodlar) {
    try {
      ilerlemeBasla(kod + ' için ERP verisi okunuyor…');
      const p = await apqpUret(kod);
      // Tekrar kontrolu COZULMUS stok koduna gore: ayni urune musteri
      // numarasindan da girilse ikinci kayit acilmasin.
      if (olan.some(x => x.stokKodu === p.stokKodu)) { atlanan.push(kod + ' → ' + p.stokKodu); continue; }
      await kaydet(p);
      basarili.push(p);
      // Belgeler + MSA calismalari ayni islemde uretilir
      ilerlemeBasla(p.stokKodu + ' için belgeler ve MSA çalışmaları üretiliyor…');
      try {
        const satir = await belgeleriUret(p.stokKodu);
        uretim.push(p.stokKodu + ': ' + uretimSayisi(satir) + ' belge/çalışma');
        uretimAyrinti = uretimAyrinti.concat(satir);
      } catch (err) {
        uretim.push(p.stokKodu + ': belgeler üretilemedi — ' + err.message);
      }
    } catch (err) { hatali.push(kod + ': ' + err.message); }
  }
  ilerlemeBitir();
  $('#uretBtn').disabled = false;
  await projeleriYukle(basarili.length ? basarili[0].id : null);
  if (basarili.length) await kanitTazele();      // yeni belgeler adımlara bağlansın
  mesaj([
    basarili.length ? basarili.length + ' APQP oluşturuldu: ' + basarili.map(p => p.stokKodu).join(', ') : '',
    uretim.length ? 'Belgeler: ' + uretim.join(' · ') : '',
    atlanan.length ? 'Atlandı (APQP&#39;si zaten var): ' + atlanan.join(', ') : '',
    hatali.length ? 'Üretilemeyen: ' + hatali.join(' | ') : '',
    uretimAyrinti.length ? '<details><summary>ayrıntı</summary><pre style="white-space:pre-wrap;'
      + 'font-size:11px;margin:6px 0 0">' + uretimAyrinti.join('\n').replace(/</g, '&lt;')
      + '</pre></details>' : '',
  ].filter(Boolean).join('<br>'));
});

$('#driveBtn').addEventListener('click', () => aktif && dosyaAc(driveKlasoru(aktif.stokKodu)));

// FR91 listesi revize olduğunda eski kayıtlara eksik adımları getirir.
// Mevcut adımların durumu, tarihleri ve kanıtları OLDUĞU GİBİ kalır.
// Kayıt açılırken kendiliğinden çalışır; düğme elle tetiklemek için durur.
async function adimlariGuncelle(sessiz) {
  if (!aktif) return 0;
  const son = aktif.devreyeAlma || bugun();
  let eklenen = 0, yeniBolum = 0;
  FR91.forEach(fb => {
    let b = aktif.bolumler.find(x => x.no === fb.no);
    if (!b) {
      b = { no: fb.no, ad: fb.ad, adimlar: [] };
      aktif.bolumler.push(b);
      yeniBolum++;
    }
    fb.adimlar.forEach(fa => {
      if (b.adimlar.some(x => x.no === fa.no)) return;
      b.adimlar.push({
        no: fa.no, ad: fa.ad, aiag: fa.aiag, sorumluluk: fa.sorumluluk,
        prosedur: fa.prosedur, form: fa.form, kanit: fa.kanit || '', aiag3: fa.aiag3 || false,
        bitis: gunEkle(son, -(TOPLAM_GUN - (FAZ[fb.no] || 56))),
        tamamlanma: '', durum: 0, kanitlar: [],
      });
      eklenen++;
    });
    b.adimlar.sort((x, y) => {
      const s1 = String(x.no).split('.'), s2 = String(y.no).split('.');
      return (Number(s1[0]) - Number(s2[0])) || (Number(s1[1] || 0) - Number(s2[1] || 0));
    });
  });
  aktif.bolumler.sort((x, y) => Number(x.no) - Number(y.no));
  if (!eklenen) { if (!sessiz) mesaj('Kayıt zaten güncel — eklenecek adım yok.'); return 0; }
  aktif.tarihce = (aktif.tarihce || []).concat([{
    rev: String((aktif.tarihce || []).length), tarih: bugun(),
    aciklama: eklenen + ' adım eklendi' + (yeniBolum ? ', ' + yeniBolum + ' yeni bölüm' : ''),
    neden: 'FR91 listesi AIAG APQP 3rd Edition (Mart 2024) ile revize edildi',
    talep: '', onay: '',
  }]);
  await kaydet(aktif);
  await kanitTazele();      // yeni adımlara kanıt varsa bağlansın
  ciz();
  mesaj(eklenen + ' adım eklendi' + (yeniBolum ? ' (' + yeniBolum + ' yeni bölüm)' : '')
    + '. Mevcut durum ve tarihler korundu.');
  return eklenen;
}



// Drive'a yeni dokuman eklenince adimlara yeniden baglanir (durum korunur:
// elle %100 yapilmis adim geri alinmaz).
// Drive klasorunu yeniden tarar: yeni dokumanlari baglar, silinenleri dusurur
async function kanitTazele() {
  if (!aktif) return;
  const drive = await driveDosyalari(aktif.stokKodu, aktif.musteriParca);
  const varolan = new Set(drive.map(d => d.yol));
  let dusen = 0;
  aktif.bolumler.forEach(b => b.adimlar.forEach(a => {
    const once = (a.kanitlar || []).length;
    a.kanitlar = (a.kanitlar || []).filter(x => x.tur !== 'drive' || varolan.has(x.yol));
    dusen += once - a.kanitlar.length;
    const yeni = adimDriveDosyalari(a.form, drive)
      .filter(d => !a.kanitlar.some(x => x.yol === d.yol));
    if (yeni.length) a.kanitlar = a.kanitlar.concat(yeni.map(d => ({ tur: 'drive', ad: d.ad, yol: d.yol })));
    if (!a.kanitlar.length && a.durum === 100 && a.kanit === '') { a.durum = 0; a.tamamlanma = ''; }
    else if (a.kanitlar.length && !a.durum) { a.durum = 100; a.tamamlanma = a.bitis; }
  }));
  await kaydet(aktif); ciz();
  return dusen;
}

$('#yeniSuzgec').addEventListener('change', () => { gorunum = 'liste'; ciz(); });

$('#belgeBtn').addEventListener('click', async () => {
  if (!aktif) return;
  $('#belgeBtn').disabled = true;
  ilerlemeBasla('Belgeler ve MSA çalışmaları üretiliyor… (pencereyi kapatmayın)');
  try {
    const satir = await belgeleriUret(aktif.stokKodu);
    await kanitTazele();
    mesaj(uretimSayisi(satir) + ' belge/çalışma üretildi.'
      + '<details><summary>ayrıntı</summary><pre style="white-space:pre-wrap;font-size:11px;'
      + 'margin:6px 0 0">' + satir.join('\n').replace(/</g, '&lt;') + '</pre></details>');
  } catch (err) {
    mesaj('Üretilemedi: ' + err.message + ' (yerel ajan çalışıyor mu?)');
  }
  ilerlemeBitir();
  $('#belgeBtn').disabled = false;
});

$('#tazeleBtn').addEventListener('click', async () => {
  if (!aktif) return;
  const yeniAdim = await adimlariGuncelle(true);      // FR91 revize olduysa eksik adimlar
  const drive = await driveDosyalari(aktif.stokKodu, aktif.musteriParca);
  let eklenen = 0, dusen = 0;
  const varolan = new Set(drive.map(d => d.yol));
  aktif.bolumler.forEach(b => b.adimlar.forEach(a => {
    const once = (a.kanitlar || []).length;
    // Silinen/artik urune ait olmayan dokumanlar adimdan dusurulur
    a.kanitlar = (a.kanitlar || []).filter(x => x.tur !== 'drive' || varolan.has(x.yol));
    dusen += once - a.kanitlar.length;
    const yeni = adimDriveDosyalari(a.form, drive).filter(d => !a.kanitlar.some(x => x.yol === d.yol));
    if (!yeni.length) return;
    a.kanitlar = a.kanitlar.concat(yeni.map(d => ({ tur: 'drive', ad: d.ad, yol: d.yol })));
    eklenen += yeni.length;
    if (!a.durum) { a.durum = 100; a.tamamlanma = a.bitis; }
  }));
  await kaydet(aktif); ciz();
  const p = [];
  if (yeniAdim) p.push(yeniAdim + ' yeni adım');
  if (eklenen) p.push(eklenen + ' doküman bağlandı');
  if (dusen) p.push(dusen + ' kayıp doküman düşürüldü');
  if (driveDisi) p.push('klasördeki ' + driveDisi + ' dosya bu ürüne ait değil (şablon vb.), bağlanmadı');
  mesaj(p.length ? p.join(' · ') : 'Her şey güncel — yeni adım ya da doküman yok.');
});

$('#silBtn').addEventListener('click', () => {
  const id = $('#projeSec').value;
  if (id) projeSil(id, panoKayitlari.find(x => x.id === id));
});

$('#projeSec').addEventListener('change', async () => {
  const hepsi = await hepsiniOku();
  aktif = hepsi.find(p => p.id === $('#projeSec').value) || null;
  ciz();
  await adimlariGuncelle(true);     // FR91 revize olduysa eksik adımlar gelsin
  await kanitTazele();              // Drive'daki yeni dokümanlar bağlansın
});

async function projeleriYukle(secId) {
  let hepsi = [];
  try { hepsi = await hepsiniOku(); }
  catch (err) {
    mesaj('Tablo okunamadı: ' + err.message + '<br>apqp.sql dosyasındaki SQL&#39;i Supabase SQL Editor&#39;de bir kez çalıştırın.');
    return;
  }
  panoKayitlari = hepsi;
  $('#projeSec').innerHTML = '<option value="">— APQP kaydı seçin —</option>'
    + hepsi.map(p => '<option value="' + p.id + '">' + p.stokKodu + ' — %' + yuzde(p) + '</option>').join('');
  if (secId) $('#projeSec').value = secId;
  aktif = hepsi.find(p => p.id === $('#projeSec').value) || null;
  if (aktif) {
    // Liste revize olduysa açılışta kendiliğinden tamamlanır
    setTimeout(async () => { await adimlariGuncelle(true); await kanitTazele(); }, 0);
  }
  if (!aktif && hepsi.length) {
    // Kayıt seçilmediyse pano açılır (hepsi bir arada görünsün)
    gorunum = 'pano';
    $('#sekmeler').hidden = false;
    [...$('#sekmeler').children].forEach(b => b.className = b.dataset.gorunum === 'pano' ? 'sec' : '');
    $('#panoKart').hidden = false;
    cizPano();
    return;
  }
  ciz();
}

projeleriYukle(null);
