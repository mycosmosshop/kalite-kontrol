# Supabase projelerini CANLI tutar: ücretsiz planda 7 gün hareketsiz kalan proje otomatik duraklatılır.
#
# ÖNEMLİ DERS (2026-08-11): Eski sürüm var olmayan bir tabloyu (keepalive_zzz) sorguluyordu.
# PostgREST bunu ŞEMA ÖNBELLEĞİNDEN 404 ile reddediyor, sorgu VERİTABANINA HİÇ GİTMİYOR →
# Supabase "hareket yok" sayıyor ve duraklatma uyarısı gelmeye devam ediyordu.
# Bu yüzden artık her projede GERÇEKTEN VAR OLAN bir tablo sorgulanır ve HTTP 200 beklenir;
# 200 dışında bir yanıt gelirse iş BAŞARISIZ olur (sessizce bozulmasın).
#
# Anahtarlar ANON/publishable — zaten uygulamaların HTML'inde yayında, gizli değil. Yalnız okuma.
name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 * * *'      # her gün 06:17 UTC
    - cron: '17 18 * * *'     # + akşam 18:17 UTC (bir koşu kaçarsa 7 günlük sayaç yine sıfırlanır)
  workflow_dispatch:           # elle de çalıştırılabilir
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping projeler (gerçek tablo, 200 zorunlu)
        run: |
          fail=0
          ping() {   # $1=ref  $2=apikey  $3=tablo
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
                   -H "apikey: $2" "https://$1.supabase.co/rest/v1/$3?select=*&limit=1")
            if [ "$code" = "200" ]; then
              echo "OK   $1  ($3)"
            else
              echo "HATA $1  ($3) -> HTTP $code"; head -c 200 /tmp/body; echo
              fail=1
            fi
          }
          # KaliteKontrol / ERP ana veri
          ping nnubrxbpthmkitueixbh "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5udWJyeGJwdGhta2l0dWVpeGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI2MDIsImV4cCI6MjA5NjEzODYwMn0.CHZUOylf_q8kkOQbFf9VWZ6-doUTlynmAhahM2EuImE" stok_kartlari
          # CMMS Pro (duraklatma uyarısı bu projeden geliyordu)
